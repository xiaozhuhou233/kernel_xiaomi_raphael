name: Build Raphael Stock Kernel

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Raphael Stock 60Hz
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            libncurses-dev \
            lld \
            llvm \
            python3 \
            rsync \
            unzip \
            wget \
            zip

      - name: Download AOSP Clang r547379
        run: |
          mkdir -p "$HOME/tc"

          git clone \
            --depth=1 \
            --branch android-16.0.0_r1 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            "$HOME/tc/clang-repo"

          test -d "$HOME/tc/clang-repo/clang-r547379"

          mv "$HOME/tc/clang-repo/clang-r547379" \
             "$HOME/tc/r547379"

          rm -rf "$HOME/tc/clang-repo"

          echo "=== Clang ==="
          "$HOME/tc/r547379/bin/clang" --version

          echo "=== LLD ==="
          "$HOME/tc/r547379/bin/ld.lld" --version

      - name: Configure Raphael
        run: |
          export PATH="$HOME/tc/r547379/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER=xiaozhuhou233
          export KBUILD_BUILD_HOST=GitHub-Actions

          ccache -M 5G
          ccache -z

          echo "=== Available configs ==="
          find arch/arm64/configs -type f | grep -E "raphael|sm8150" | sort

          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="ccache clang" \
            vendor/sm8150-perf_defconfig

          echo "=== Config generated ==="
          test -f out/.config
          grep -E \
            "CONFIG_BUILD_ARM64_UNCOMPRESSED_KERNEL|CONFIG_BUILD_ARM64_DT_OVERLAY" \
            out/.config || true

      - name: Build kernel
        run: |
          export PATH="$HOME/tc/r547379/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER=xiaozhuhou233
          export KBUILD_BUILD_HOST=GitHub-Actions

          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="ccache clang" \
            -j$(nproc)

      - name: Show build outputs
        run: |
          echo "=== arch/arm64/boot ==="
          find out/arch/arm64/boot \
            -maxdepth 2 \
            -type f \
            \( -name "Image*" -o -name "*.dtb" -o -name "*.dtbo" -o -name "dtbo.img" \) \
            -exec ls -lh {} \; || true

          echo "=== Expected Raphael outputs ==="

          test -f out/arch/arm64/boot/Image.gz-dtb
          ls -lh out/arch/arm64/boot/Image.gz-dtb

          if [ -f out/arch/arm64/boot/dtbo.img ]; then
            ls -lh out/arch/arm64/boot/dtbo.img
          fi

      - name: Upload stock kernel
        uses: actions/upload-artifact@v4
        with:
          name: raphael-stock-60hz
          if-no-files-found: error
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dtbo.img
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
