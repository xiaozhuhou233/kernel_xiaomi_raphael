name: Build Raphael Stock Kernel

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "构建模式"
        required: true
        default: "quick"
        type: choice
        options:
          - quick
          - full

jobs:
  build:
    name: Build Raphael Stock 60Hz
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check source version
        run: |
          echo "=== COMMIT ==="
          git rev-parse HEAD

          echo "=== BRANCH ==="
          git branch --show-current || true

          echo "=== USB PD verified/verifed ==="
          grep -n -E "verified|verifed" \
            drivers/usb/pd/policy_engine.c | head -80 || true

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            libncurses-dev \
            lld \
            llvm \
            python3 \
            rsync \
            unzip \
            wget \
            zip

      # -------------------------------
      # Clang cache
      # -------------------------------

      - name: Cache AOSP Clang
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: ~/tc/r547379
          key: aosp-clang-r547379-v1

      - name: Download AOSP Clang r547379
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/tc"

          echo "=== Download AOSP Clang r547379 ==="

          git clone \
            --depth=1 \
            --branch android-16.0.0_r1 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            "$HOME/tc/clang-repo"

          echo "=== Check clang directory ==="

          test -d "$HOME/tc/clang-repo/clang-r547379"

          mv "$HOME/tc/clang-repo/clang-r547379" \
             "$HOME/tc/r547379"

          rm -rf "$HOME/tc/clang-repo"

      - name: Check Clang
        run: |
          echo "=== Clang ==="
          "$HOME/tc/r547379/bin/clang" --version

          echo "=== LLD ==="
          "$HOME/tc/r547379/bin/ld.lld" --version

      # -------------------------------
      # ccache
      # -------------------------------

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: raphael-ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            raphael-ccache-${{ runner.os }}-${{ github.ref_name }}-
            raphael-ccache-${{ runner.os }}-

      - name: Setup ccache
        run: |
          ccache -M 5G
          ccache -z
          ccache -s

      # -------------------------------
      # Kernel config
      # -------------------------------

      - name: Configure Raphael
        run: |
          export PATH="$HOME/tc/r547379/bin:$PATH"

          export ARCH=arm64
          export SUBARCH=arm64

          export KBUILD_BUILD_USER=xiaozhuhou233
          export KBUILD_BUILD_HOST=GitHub-Actions

          echo "=== Generate base SM8150 config ==="

          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="ccache clang" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            vendor/sm8150-perf_defconfig

          echo "=== Merge Xiaomi config fragments ==="

          ./scripts/kconfig/merge_config.sh \
            -m \
            -O out \
            out/.config \
            arch/arm64/configs/vendor/xiaomi/sm8150-common.config \
            arch/arm64/configs/vendor/xiaomi/raphael.config

          echo "=== Run olddefconfig ==="

          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="ccache clang" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            olddefconfig

          echo
          echo "========================================="
          echo "=== Important Raphael configuration ==="
          echo "========================================="

          grep -E \
            "CONFIG_MACH_XIAOMI|CONFIG_MACH_XIAOMI_SM8150|CONFIG_MACH_XIAOMI_RAPHAEL|CONFIG_BUILD_ARM64_DT_OVERLAY" \
            out/.config || true

          echo
          echo "=== KernelSU ==="

          grep -E \
            "CONFIG_KSU|CONFIG_KSU_SUSFS" \
            out/.config || true

      # -------------------------------
      # QUICK TEST 1
      # USB-PD
      # -------------------------------

      - name: Quick test USB PD
        run: |
          export PATH="$HOME/tc/r547379/bin:$PATH"

          export ARCH=arm64
          export SUBARCH=arm64

          echo "========================================="
          echo "=== Build policy_engine.o only ==="
          echo "========================================="

          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="ccache clang" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            drivers/usb/pd/policy_engine.o \
            -j$(nproc)

          echo
          echo "USB-PD test passed."

      # -------------------------------
      # QUICK TEST 2
      # DTS / DTBO
      # -------------------------------

      - name: Quick test Raphael DTBO
        run: |
          export PATH="$HOME/tc/r547379/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64

          echo "========================================="
          echo "=== Build Raphael DTBO only ==="
          echo "========================================="

          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="ccache clang" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            qcom/raphael-sm8150-overlay.dtbo \
            -j$(nproc)

          echo
          echo "=== Raphael DTBO output ==="

          find out/arch/arm64/boot/dts/qcom \
            -name "*raphael*.dtbo" \
            -exec ls -lh {} \;

          echo
          echo "Raphael DTBO test passed."

      # -------------------------------
      # FULL BUILD
      # Only when mode = full
      # -------------------------------

      - name: Build full kernel
        if: ${{ inputs.mode == 'full' }}
        run: |
          export PATH="$HOME/tc/r547379/bin:$PATH"

          export ARCH=arm64
          export SUBARCH=arm64

          export KBUILD_BUILD_USER=xiaozhuhou233
          export KBUILD_BUILD_HOST=GitHub-Actions

          echo "========================================="
          echo "=== Full Raphael kernel build ==="
          echo "========================================="

          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="ccache clang" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            -j$(nproc)

      - name: Show ccache statistics
        if: always()
        run: |
          ccache -s || true

      # -------------------------------
      # Outputs — full build only
      # -------------------------------

      - name: Show build outputs
        if: ${{ inputs.mode == 'full' }}
        run: |
          echo "=== arch/arm64/boot ==="

          find out/arch/arm64/boot \
            -maxdepth 3 \
            -type f \
            \( \
              -name "Image*" \
              -o -name "*.dtb" \
              -o -name "*.dtbo" \
              -o -name "dtbo.img" \
            \) \
            -exec ls -lh {} \; || true

          echo
          echo "=== Expected Raphael outputs ==="

          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            ls -lh out/arch/arm64/boot/Image.gz-dtb
          fi

          if [ -f out/arch/arm64/boot/dtbo.img ]; then
            ls -lh out/arch/arm64/boot/dtbo.img
          fi

      - name: Upload stock kernel
        if: ${{ inputs.mode == 'full' }}
        uses: actions/upload-artifact@v4
        with:
          name: raphael-stock-60hz
          if-no-files-found: warn
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dtbo.img
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
