name: Build Raphael Stock Kernel

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "构建模式"
        required: true
        default: "quick"
        type: choice
        options:
          - quick
          - full

jobs:
  build:
    name: Build Raphael Stock 60Hz
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check source version
        run: |
          echo "=== COMMIT ==="
          git rev-parse HEAD

          echo "=== BRANCH ==="
          git branch --show-current || true

          echo "=== USB PD verified/verifed ==="
          grep -n -E "verified|verifed" \
            drivers/usb/pd/policy_engine.c | head -80 || true

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            libncurses-dev \
            lld \
            llvm \
            python3 \
            rsync \
            unzip \
            wget \
            zip

      # ============================================================
      # Restore prebuilt AOSP Clang
      # ============================================================

      - name: Restore AOSP Clang
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: ~/tc/r547379
          key: aosp-clang-r547379-v1
          fail-on-cache-miss: true

      - name: Check Clang
        run: |
          echo "=== Clang ==="
          "$HOME/tc/r547379/bin/clang" --version

          echo
          echo "=== LLD ==="
          "$HOME/tc/r547379/bin/ld.lld" --version

      # ============================================================
      # ccache
      # ============================================================

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: raphael-ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            raphael-ccache-${{ runner.os }}-${{ github.ref_name }}-
            raphael-ccache-${{ runner.os }}-

      - name: Setup ccache
        run: |
          ccache -M 5G
          ccache -z
          ccache -s

      # ============================================================
      # Kernel configuration
      # ============================================================

      - name: Configure Raphael
        run: |
          export PATH="$HOME/tc/r547379/bin:$PATH"

          export ARCH=arm64
          export SUBARCH=arm64

          export KBUILD_BUILD_USER=xiaozhuhou233
          export KBUILD_BUILD_HOST=GitHub-Actions

          echo "========================================="
          echo "=== Generate base SM8150 config ==="
          echo "========================================="

          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="ccache clang" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            vendor/sm8150-perf_defconfig

          echo
          echo "========================================="
          echo "=== Merge Xiaomi config fragments ==="
          echo "========================================="

          ./scripts/kconfig/merge_config.sh \
            -m \
            -O out \
            out/.config \
            arch/arm64/configs/vendor/xiaomi/sm8150-common.config \
            arch/arm64/configs/vendor/xiaomi/raphael.config

          echo
          echo "========================================="
          echo "=== Run olddefconfig ==="
          echo "========================================="

          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="ccache clang" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            olddefconfig

          echo
          echo "========================================="
          echo "=== Important Raphael configuration ==="
          echo "========================================="

          grep -E \
            "CONFIG_MACH_XIAOMI|CONFIG_MACH_XIAOMI_SM8150|CONFIG_MACH_XIAOMI_RAPHAEL|CONFIG_BUILD_ARM64_DT_OVERLAY" \
            out/.config || true

          echo
          echo "========================================="
          echo "=== KernelSU / SUSFS configuration ==="
          echo "========================================="

          grep -E \
            "CONFIG_KSU|CONFIG_KSU_SUSFS|CONFIG_KSU_MANUAL_HOOK" \
            out/.config || true

      # ============================================================
      # QUICK TEST 1: USB-PD
      # ============================================================

      - name: Quick test USB PD
        run: |
          export PATH="$HOME/tc/r547379/bin:$PATH"

          export ARCH=arm64
          export SUBARCH=arm64

          echo "========================================="
          echo "=== Build policy_engine.o only ==="
          echo "========================================="

          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="ccache clang" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            drivers/usb/pd/policy_engine.o \
            -j$(nproc)

          echo
          echo "USB-PD test passed."

      # ============================================================
      # QUICK TEST 2: Raphael-only DTBO
      # ============================================================

      - name: Quick test Raphael DTBO
        run: |
          export PATH="$HOME/tc/r547379/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64

          echo "========================================="
          echo "=== Limit Xiaomi SM8150 DTBO to Raphael ==="
          echo "========================================="

          python3 <<'PY'
          from pathlib import Path

          path = Path("arch/arm64/boot/dts/qcom/Makefile")
          text = path.read_text()

          old = """\
          \tdtbo-$(CONFIG_ARCH_SM8150) += \\
          \t\tandromeda-sm8150-overlay.dtbo \\
          \t\tandromeda-sm8150-p1-overlay.dtbo \\
          \t\tandromeda-sm8150-p1_1-overlay.dtbo \\
          \t\tandromeda-sm8150-p2-overlay.dtbo \\
          \t\tandromeda-sm8150-p2_1-overlay.dtbo \\
          \t\tandromeda-sm8150-p2_2-overlay.dtbo \\
          \t\tandromeda-sm8150-p2_21-overlay.dtbo \\
          \t\tandromeda-sm8150-p2_22-overlay.dtbo \\
          \t\tcepheus-sm8150-overlay.dtbo \\
          \t\tcrux-sm8150-overlay.dtbo \\
          \t\tnabu-sm8150-overlay.dtbo \\
          \t\traphael-sm8150-overlay.dtbo \\
          \t\tvayu-sm8150-overlay.dtbo
          """

          new = """\
          \tdtbo-$(CONFIG_ARCH_SM8150) += \\
          \t\traphael-sm8150-overlay.dtbo
          """

          if old not in text:
              raise SystemExit("ERROR: Xiaomi SM8150 DTBO list not found")

          text = text.replace(old, new, 1)
          path.write_text(text)

          print("Raphael-only DTBO list applied.")
          PY

          echo
          echo "=== Verify DTBO list ==="
          grep -n -A5 -B2 "raphael-sm8150-overlay.dtbo" \
            arch/arm64/boot/dts/qcom/Makefile | head -30

          echo
          echo "========================================="
          echo "=== Build Raphael DTB/DTBO ==="
          echo "========================================="

          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="ccache clang" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            dtbs \
            -j$(nproc)

          echo
          echo "========================================="
          echo "=== Raphael DTBO output ==="
          echo "========================================="

          find out/arch/arm64/boot/dts/qcom \
            -type f \
            \( -name "*raphael*.dtbo" -o -name "*xiaomi*.dtb" \) \
            -exec ls -lh {} \;

          test -f \
            out/arch/arm64/boot/dts/qcom/raphael-sm8150-overlay.dtbo

          echo
          echo "Raphael DTBO test passed."

      # ============================================================
      # FULL BUILD
      # ============================================================

      - name: Build full kernel
        if: ${{ inputs.mode == 'full' }}
        run: |
          export PATH="$HOME/tc/r547379/bin:$PATH"

          export ARCH=arm64
          export SUBARCH=arm64

          export KBUILD_BUILD_USER=xiaozhuhou233
          export KBUILD_BUILD_HOST=GitHub-Actions

          echo "========================================="
          echo "=== Full Raphael kernel build ==="
          echo "========================================="

          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="ccache clang" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            -j$(nproc)

      # ============================================================
      # Diagnostics
      # ============================================================

      - name: Show ccache statistics
        if: always()
        run: |
          echo "=== ccache statistics ==="
          ccache -s || true

      # ============================================================
      # Outputs — full mode only
      # ============================================================

      - name: Show build outputs
        if: ${{ inputs.mode == 'full' }}
        run: |
          echo "=== arch/arm64/boot ==="

          find out/arch/arm64/boot \
            -maxdepth 3 \
            -type f \
            \( \
              -name "Image*" \
              -o -name "*.dtb" \
              -o -name "*.dtbo" \
              -o -name "dtbo.img" \
            \) \
            -exec ls -lh {} \; || true

          echo
          echo "=== Expected Raphael outputs ==="

          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "Image.gz-dtb:"
            ls -lh out/arch/arm64/boot/Image.gz-dtb
          fi

          if [ -f out/arch/arm64/boot/Image ]; then
            echo "Image:"
            ls -lh out/arch/arm64/boot/Image
          fi

          if [ -f out/arch/arm64/boot/Image.gz ]; then
            echo "Image.gz:"
            ls -lh out/arch/arm64/boot/Image.gz
          fi

          if [ -f out/arch/arm64/boot/dtbo.img ]; then
            echo "dtbo.img:"
            ls -lh out/arch/arm64/boot/dtbo.img
          fi

      - name: Upload stock kernel
        if: ${{ inputs.mode == 'full' }}
        uses: actions/upload-artifact@v4
        with:
          name: raphael-stock-60hz
          if-no-files-found: warn
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dtbo.img
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
