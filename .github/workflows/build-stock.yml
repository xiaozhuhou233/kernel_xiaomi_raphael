name: Build Raphael Stock Kernel

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "构建模式"
        required: true
        default: "quick"
        type: choice
        options:
          - quick
          - full

jobs:
  build:
    name: Build Raphael Stock 60Hz
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check source version
        run: |
          echo "=== COMMIT ==="
          git rev-parse HEAD

          echo "=== BRANCH ==="
          git branch --show-current || true

          echo "=== USB PD verified/verifed ==="
          grep -n -E "verified|verifed" \
            drivers/usb/pd/policy_engine.c | head -80 || true

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            libncurses-dev \
            lld \
            llvm \
            python3 \
            rsync \
            unzip \
            wget \
            zip \
            device-tree-compiler

      # ============================================================
      # Restore prebuilt AOSP Clang
      # ============================================================

      - name: Restore AOSP Clang
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: ~/tc/r547379
          key: aosp-clang-r547379-v1
          fail-on-cache-miss: true

      - name: Check Clang
        run: |
          echo "=== Clang ==="
          "$HOME/tc/r547379/bin/clang" --version

          echo
          echo "=== LLD ==="
          "$HOME/tc/r547379/bin/ld.lld" --version

      - name: Compute kernel source cache key
        id: kernel-cache-key
        run: |
          KERNEL_SOURCE_SHA="$(git log -1 --format=%H -- \
            . \
            ':(exclude).github/**' \
            ':(exclude)scripts/package-anykernel3.sh' \
            ':(exclude)scripts/dtc/mkdtboimg.py')"
          echo "sha=$KERNEL_SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "Kernel source cache key: $KERNEL_SOURCE_SHA"

      - name: Restore kernel output cache
        if: ${{ inputs.mode == 'full' }}
        id: kernel-out-cache
        uses: actions/cache/restore@v4
        with:
          path: out
          key: raphael-out-${{ runner.os }}-r547379-${{ steps.kernel-cache-key.outputs.sha }}

      # ============================================================
      # ccache
      # ============================================================

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: raphael-ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            raphael-ccache-${{ runner.os }}-${{ github.ref_name }}-
            raphael-ccache-${{ runner.os }}-

      - name: Setup ccache
        run: |
          ccache -M 5G
          ccache -z
          ccache -s

      # ============================================================
      # Kernel configuration
      # ============================================================

      - name: Configure Raphael
        run: |
          export PATH="$HOME/tc/r547379/bin:$PATH"

          export ARCH=arm64
          export SUBARCH=arm64

          export KBUILD_BUILD_USER=xiaozhuhou233
          export KBUILD_BUILD_HOST=GitHub-Actions

          echo "========================================="
          echo "=== Generate base SM8150 config ==="
          echo "========================================="

          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="ccache clang" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            vendor/sm8150-perf_defconfig

          echo
          echo "========================================="
          echo "=== Merge Xiaomi config fragments ==="
          echo "========================================="

          ./scripts/kconfig/merge_config.sh \
            -m \
            -O out \
            out/.config \
            arch/arm64/configs/vendor/xiaomi/sm8150-common.config \
            arch/arm64/configs/vendor/xiaomi/raphael.config

          echo
          echo "========================================="
          echo "=== Run olddefconfig ==="
          echo "========================================="

          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="ccache clang" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            olddefconfig

          echo
          echo "========================================="
          echo "=== Important Raphael configuration ==="
          echo "========================================="

          grep -E \
            "CONFIG_MACH_XIAOMI|CONFIG_MACH_XIAOMI_SM8150|CONFIG_MACH_XIAOMI_RAPHAEL|CONFIG_BUILD_ARM64_DT_OVERLAY" \
            out/.config || true

          echo
          echo "========================================="
          echo "=== KernelSU / SUSFS configuration ==="
          echo "========================================="

          grep -E \
            "CONFIG_KSU|CONFIG_KSU_SUSFS|CONFIG_KSU_MANUAL_HOOK" \
            out/.config || true

      # ============================================================
      # QUICK TEST 1: USB-PD
      # ============================================================
    
      - name: Quick test USB PD
        run: |
          export PATH="$HOME/tc/r547379/bin:$PATH"

          export ARCH=arm64
          export SUBARCH=arm64

          echo "========================================="
          echo "=== Build policy_engine.o only ==="
          echo "========================================="

          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="ccache clang" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            drivers/usb/pd/policy_engine.o \
            -j$(nproc)

          echo
          echo "USB-PD test passed."

      # ============================================================
      # QUICK TEST 2: Raphael-only DTBO
      # ============================================================
      - name: Debug Raphael DTS preprocessing
        if: ${{ inputs.mode == 'quick' }}
        run: |
          export PATH="$HOME/tc/r547379/bin:$PATH"

          mkdir -p debug-dts

          "$HOME/tc/r547379/bin/clang" \
            -E \
            -x assembler-with-cpp \
            -nostdinc \
            -undef \
            -D__DTS__ \
            -I scripts/dtc/include-prefixes \
            -I arch/arm64/boot/dts/qcom \
            arch/arm64/boot/dts/qcom/raphael-sm8150-overlay.dts \
            -o debug-dts/raphael-preprocessed.dts

          echo "=== Beginning of preprocessed DTS ==="
          sed -n '1,120p' debug-dts/raphael-preprocessed.dts

          echo "=== tlmm locations ==="
          grep -n -B5 -A10 '&tlmm' \
            debug-dts/raphael-preprocessed.dts | head -80 || true
      - name: Debug Raphael DTBO only
        if: ${{ inputs.mode == 'quick' }}
        run: |
          export PATH="$HOME/tc/r547379/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64

          echo "========================================="
          echo "=== Force Raphael-only DTBO ==="
          echo "========================================="

          python3 <<'PY'
          from pathlib import Path

          p = Path("arch/arm64/boot/dts/qcom/Makefile")
          lines = p.read_text().splitlines()

          raphael_line = None
          start = None
          end = None

          # 找 Raphael DTBO
          for i, line in enumerate(lines):
              if "raphael-sm8150-overlay.dtbo" in line and "-base" not in line:
                  raphael_line = i
                  break

          if raphael_line is None:
              raise SystemExit(
                  "ERROR: Cannot find raphael-sm8150-overlay.dtbo"
              )

          # 向上寻找这个 dtbo-$(CONFIG_ARCH_SM8150) += 块的开始
          for i in range(raphael_line, -1, -1):
              if "dtbo-$(CONFIG_ARCH_SM8150)" in lines[i]:
                  start = i
                  break

          if start is None:
              raise SystemExit("ERROR: Cannot find DTBO block start")

          # 向下找连续的反斜杠列表结束位置
          end = start

          while end < len(lines):
              current = lines[end].rstrip()

              if end == start:
                  end += 1
                  continue

              # 当前行没有 \，说明这是列表最后一项
              if not current.endswith("\\"):
                  break

              end += 1

          # end 现在指向列表最后一项
          print("Original block:")
          for line in lines[start:end + 1]:
              print(line)

          new_block = [
              "dtbo-$(CONFIG_ARCH_SM8150) += \\",
              "\traphael-sm8150-overlay.dtbo",
          ]

          lines[start:end + 1] = new_block

          p.write_text("\n".join(lines) + "\n")

          print()
          print("New block:")
          for line in new_block:
              print(line)
          PY

          echo
          echo "========================================="
          echo "=== VERIFY MAKEFILE ==="
          echo "========================================="

          sed -n '1,35p' arch/arm64/boot/dts/qcom/Makefile

          echo
          echo "========================================="
          echo "=== Check active DTBO list ==="
          echo "========================================="

          grep -n \
            "dtbo-\$(CONFIG_ARCH_SM8150)" \
            arch/arm64/boot/dts/qcom/Makefile || true

          echo
          echo "========================================="
          echo "=== DTC version ==="
          echo "========================================="

          out/scripts/dtc/dtc --version || true

          echo
          echo "========================================="
          echo "=== Build Raphael DTBO - V=1 ==="
          echo "========================================="

          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="ccache clang" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            DTC_EXT=/usr/bin/dtc \
            V=1 \
            dtbs \
            -j1

          echo
          echo "========================================="
          echo "=== Raphael output ==="
          echo "========================================="

          find out/arch/arm64/boot/dts/qcom \
            -type f \
            -name "*raphael*.dtbo" \
            -exec ls -lh {} \;

          test -f \
            out/arch/arm64/boot/dts/qcom/raphael-sm8150-overlay.dtbo

          echo
          echo "Raphael DTBO test PASSED."

      - name: Test Raphael with system DTC
        if: ${{ inputs.mode == 'quick' }}
        run: |
          echo "=== System DTC ==="
          /usr/bin/dtc --version

          FILE="out/arch/arm64/boot/dts/qcom/.raphael-sm8150-overlay.dtbo.dts.tmp"
          OUTPUT="/tmp/raphael-system-dtc.dtbo"

          echo "=== Compile the exact Kbuild preprocessed DTS ==="
          test -f "$FILE"
          /usr/bin/dtc \
            -O dtb \
            -o "$OUTPUT" \
            -b 0 \
            -@ \
            "$FILE"

          echo "=== System DTC result ==="
          ls -lh "$OUTPUT"

      - name: Build kernel and device trees
        if: ${{ inputs.mode == 'full' }}
        run: |
          export PATH="$HOME/tc/r547379/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64

          if [ "${{ steps.kernel-out-cache.outputs.cache-hit }}" = "true" ] && \
             [ -s out/arch/arm64/boot/Image.gz-dtb ] && \
             [ -s out/arch/arm64/boot/dts/qcom/raphael-sm8150-overlay.dtbo ]; then
            echo "Reusing cached kernel and Raphael DTBO."
          else
            make O=out \
              ARCH=arm64 \
              LLVM=1 \
              LLVM_IAS=1 \
              CC="ccache clang" \
              CROSS_COMPILE=aarch64-linux-gnu- \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              DTC_EXT=/usr/bin/dtc \
              Image.gz-dtb \
              dtbs \
              -j$(nproc)
          fi

      - name: Save kernel output cache
        if: ${{ inputs.mode == 'full' && steps.kernel-out-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: out
          key: raphael-out-${{ runner.os }}-r547379-${{ steps.kernel-cache-key.outputs.sha }}

      - name: Create Raphael DTBO image
        if: ${{ inputs.mode == 'full' }}
        run: |
          python3 scripts/dtc/mkdtboimg.py create \
            out/arch/arm64/boot/dtbo.img \
            --page_size=4096 \
            out/arch/arm64/boot/dts/qcom/raphael-sm8150-overlay.dtbo

          python3 scripts/dtc/mkdtboimg.py dump \
            out/arch/arm64/boot/dtbo.img

      - name: Package AnyKernel3
        if: ${{ inputs.mode == 'full' }}
        run: |
          chmod +x scripts/package-anykernel3.sh
          scripts/package-anykernel3.sh

      # ============================================================
      # Diagnostics
      # ============================================================
      - name: Dump failed Raphael preprocessed DTS
        if: ${{ failure() && inputs.mode == 'quick' }}
        run: |
          echo "========================================="
          echo "=== Actual DTS passed to DTC ==="
          echo "========================================="

          FILE="out/arch/arm64/boot/dts/qcom/.raphael-sm8150-overlay.dtbo.dts.tmp"

          if [ -f "$FILE" ]; then
            echo "Found: $FILE"
            echo
            nl -ba "$FILE" | head -250
          else
            echo "DTS tmp file not found."

            echo
            echo "=== Available Raphael temp files ==="

            find out/arch/arm64/boot/dts/qcom \
              -maxdepth 1 \
              -type f \
              -name "*raphael*" \
              -print || true
          fi
      - name: Show ccache statistics
        if: always()
        run: |
          echo "=== ccache statistics ==="
          ccache -s || true

      # ============================================================
      # Outputs — full mode only
      # ============================================================

      - name: Show build outputs
        if: ${{ inputs.mode == 'full' }}
        run: |
          echo "=== arch/arm64/boot ==="

          find out/arch/arm64/boot \
            -maxdepth 3 \
            -type f \
            \( \
              -name "Image*" \
              -o -name "*.dtb" \
              -o -name "*.dtbo" \
              -o -name "dtbo.img" \
            \) \
            -exec ls -lh {} \; || true

          echo
          echo "=== Expected Raphael outputs ==="

          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "Image.gz-dtb:"
            ls -lh out/arch/arm64/boot/Image.gz-dtb
          fi

          if [ -f out/arch/arm64/boot/Image ]; then
            echo "Image:"
            ls -lh out/arch/arm64/boot/Image
          fi

          if [ -f out/arch/arm64/boot/Image.gz ]; then
            echo "Image.gz:"
            ls -lh out/arch/arm64/boot/Image.gz
          fi

          if [ -f out/arch/arm64/boot/dtbo.img ]; then
            echo "dtbo.img:"
            ls -lh out/arch/arm64/boot/dtbo.img
          fi

      - name: Upload stock kernel
        if: ${{ inputs.mode == 'full' }}
        uses: actions/upload-artifact@v4
        with:
          name: raphael-stock-60hz
          if-no-files-found: warn
          path: |
            out/raphael-stock-ksunext-ak3.zip
            out/raphael-stock-ksunext-ak3.zip.sha256
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dtbo.img
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
