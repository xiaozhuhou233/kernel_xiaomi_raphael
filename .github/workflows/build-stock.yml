name: Build Raphael Stock Kernel

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "构建模式"
        required: true
        default: "quick"
        type: choice
        options:
          - quick
          - full

jobs:
  build:
    name: Build Raphael 60/72/84/90Hz
    runs-on: ubuntu-24.04

    # Mark LOCALVERSION as explicitly set so scripts/setlocalversion does not
    # append a '+' after the CI-only DTS transformer makes the tree dirty.
    env:
      LOCALVERSION: ""

    permissions:
      contents: read

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Enable Raphael 60/72/84/90 Hz modes
        run: |
          python3 scripts/enable-raphael-90hz.py

          python3 <<'PY'
          from pathlib import Path

          display = Path(
              "arch/arm64/boot/dts/qcom/xiaomi/overlay/common/display"
          )
          panels = (
              display / "dsi-panel-ss-fhd-ea8076-cmd.dtsi",
              display / "dsi-panel-ss-fhd-ea8076-global-cmd.dtsi",
          )

          def timing_block(text: str, node: int) -> str:
              marker = f"timing@{node}{{"
              start = text.index(marker)
              brace = text.index("{", start)
              depth = 0
              for pos in range(brace, len(text)):
                  if text[pos] == "{":
                      depth += 1
                  elif text[pos] == "}":
                      depth -= 1
                      if depth == 0:
                          return text[start:pos + 1]
              raise RuntimeError(f"unterminated {marker}")

          expected_90 = (
              "qcom,mdss-dsi-panel-framerate = <90>;",
              "qcom,mdss-dsi-panel-clockrate = <1500000000>;",
              "qcom,mdss-mdp-transfer-time-us = <10108>;",
              "qcom,mdss-dsi-h-front-porch = <22>;",
              "qcom,mdss-dsi-h-back-porch = <16>;",
              "qcom,mdss-dsi-h-pulse-width = <16>;",
              "qcom,mdss-dsi-v-back-porch = <22>;",
              "qcom,mdss-dsi-v-front-porch = <16>;",
              "qcom,mdss-dsi-v-pulse-width = <16>;",
              "qcom,mdss-dsi-panel-phy-timings = "
              "[00 24 0A 0A 26 25 09 0A 06 03 04 00 1E 1A];",
              "A3 A9 A1 4A 00 1A B8",
              "A3 A9 A1 4A 00 8A 18",
          )
          expected_step = (
              "xiaomi,mdss-dsi-step-refresh-switch;",
              "xiaomi,mdss-dsi-step-refresh-base-rate = <60>;",
              "xiaomi,mdss-dsi-step-refresh-bridge-rate = <72>;",
              "xiaomi,mdss-dsi-step-refresh-target-rate = <90>;",
          )
          forbidden_90 = (
              "qcom,mdss-dsi-panel-clockrate = <1650000000>;",
              "A3 B9 A1 4A 00 1A B8",
              "A3 B9 A1 4A 00 8A 18",
          )

          for panel in panels:
              text = panel.read_text()
              high90 = timing_block(text, 3)
              missing = [item for item in expected_90 if item not in high90]
              missing.extend(item for item in expected_step if item not in text)
              if missing:
                  raise SystemExit(f"{panel}: missing true-90 data: {missing}")
              forbidden = [item for item in forbidden_90 if item in high90]
              if forbidden:
                  raise SystemExit(f"{panel}: stale fake-90 data: {forbidden}")
              print(f"Verified true 90 Hz source tuple: {panel}")
          PY

      - name: Check source version
        run: |
          echo "=== COMMIT ==="
          git rev-parse HEAD

          echo "=== BRANCH ==="
          git branch --show-current || true

          echo "=== USB PD verified/verifed ==="
          grep -n -E "verified|verifed" \
            drivers/usb/pd/policy_engine.c | head -80 || true

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            libncurses-dev \
            lld \
            llvm \
            python3 \
            rsync \
            unzip \
            wget \
            zip \
            device-tree-compiler

      # ============================================================
      # Restore prebuilt AOSP Clang
      # ============================================================

      - name: Restore AOSP Clang
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: ~/tc/r547379
          key: aosp-clang-r547379-v1
          fail-on-cache-miss: true

      - name: Check Clang
        run: |
          echo "=== Clang ==="
          "$HOME/tc/r547379/bin/clang" --version

          echo
          echo "=== LLD ==="
          "$HOME/tc/r547379/bin/ld.lld" --version

      - name: Compute kernel source cache key
        id: kernel-cache-key
        run: |
          KERNEL_SOURCE_SHA="$(git log -1 --format=%H -- \
            . \
            ':(exclude).github/**' \
            ':(exclude)scripts/package-anykernel3.sh' \
            ':(exclude)scripts/dtc/mkdtboimg.py')"
          echo "sha=$KERNEL_SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "Kernel source cache key: $KERNEL_SOURCE_SHA"

      - name: Restore kernel output cache
        if: ${{ inputs.mode == 'full' }}
        id: kernel-out-cache
        uses: actions/cache/restore@v4
        with:
          path: out
          key: raphael-out-${{ runner.os }}-r547379-${{ steps.kernel-cache-key.outputs.sha }}
          # No restore-keys fallback: a prefix hit would restore the kernel
          # and DTBO of an older source tree and, because the restore step
          # then reports cache-hit=true, the Build step would silently reuse
          # them instead of rebuilding.  That shipped a "new" package whose
          # kernel/DTBO were byte-identical to the previous round.  Only
          # reuse the output cache when the source tree is exactly the same.

      # ============================================================
      # ccache
      # ============================================================

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: raphael-ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            raphael-ccache-${{ runner.os }}-${{ github.ref_name }}-
            raphael-ccache-${{ runner.os }}-

      - name: Setup ccache
        run: |
          ccache -M 5G
          ccache -z
          ccache -s

      # ============================================================
      # Kernel configuration
      # ============================================================

      - name: Configure Raphael
        run: |
          export PATH="$HOME/tc/r547379/bin:$PATH"

          export ARCH=arm64
          export SUBARCH=arm64

          export KBUILD_BUILD_USER=xiaozhuhou233
          export KBUILD_BUILD_HOST=GitHub-Actions

          echo "========================================="
          echo "=== Generate base SM8150 config ==="
          echo "========================================="

          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="ccache clang" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            vendor/sm8150-perf_defconfig

          echo
          echo "========================================="
          echo "=== Merge Xiaomi config fragments ==="
          echo "========================================="

          ./scripts/kconfig/merge_config.sh \
            -m \
            -O out \
            out/.config \
            arch/arm64/configs/vendor/xiaomi/sm8150-common.config \
            arch/arm64/configs/vendor/xiaomi/raphael.config

          echo
          echo "========================================="
          echo "=== Run olddefconfig ==="
          echo "========================================="

          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="ccache clang" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            olddefconfig

          echo
          echo "========================================="
          echo "=== Important Raphael configuration ==="
          echo "========================================="

          grep -E \
            "CONFIG_MACH_XIAOMI|CONFIG_MACH_XIAOMI_SM8150|CONFIG_MACH_XIAOMI_RAPHAEL|CONFIG_BUILD_ARM64_DT_OVERLAY" \
            out/.config || true

          echo
          echo "========================================="
          echo "=== KernelSU / SUSFS configuration ==="
          echo "========================================="

          grep -E \
            "CONFIG_KSU|CONFIG_KSU_SUSFS|CONFIG_KSU_MANUAL_HOOK" \
            out/.config || true

          echo
          echo "========================================="
          echo "=== Kernel release shown in Settings ==="
          echo "========================================="

          KERNEL_RELEASE="$(make -s O=out ARCH=arm64 kernelrelease)"
          echo "$KERNEL_RELEASE"

          EXPECTED_RELEASE="4.14.357-openela-SOVIET-Mod-for-EvolutionX"
          if [ "$KERNEL_RELEASE" != "$EXPECTED_RELEASE" ]; then
            echo "ERROR: expected '$EXPECTED_RELEASE'" >&2
            echo "ERROR: actual   '$KERNEL_RELEASE'" >&2
            exit 1
          fi

      # ============================================================
      # QUICK TEST 1: USB-PD
      # ============================================================
    
      - name: Quick test USB PD
        run: |
          export PATH="$HOME/tc/r547379/bin:$PATH"

          export ARCH=arm64
          export SUBARCH=arm64

          echo "========================================="
          echo "=== Build policy_engine.o only ==="
          echo "========================================="

          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="ccache clang" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            drivers/usb/pd/policy_engine.o \
            -j$(nproc)

          echo
          echo "USB-PD test passed."

      - name: Quick test Bool-X DSI clock port
        run: |
          export PATH="$HOME/tc/r547379/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64

          # dsi-staging has no Makefile of its own; its objects are members of
          # msm_drm-y. Ask old Kbuild to recurse through the owning directory.
          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="ccache clang" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            drivers/gpu/drm/msm/ \
            -j$(nproc)

          echo "Bool-X DSI clock port compiled successfully."

      # ============================================================
      # QUICK TEST 2: Raphael-only DTBO
      # ============================================================
      - name: Debug Raphael DTS preprocessing
        if: ${{ inputs.mode == 'quick' }}
        run: |
          export PATH="$HOME/tc/r547379/bin:$PATH"

          mkdir -p debug-dts

          "$HOME/tc/r547379/bin/clang" \
            -E \
            -x assembler-with-cpp \
            -nostdinc \
            -undef \
            -D__DTS__ \
            -I scripts/dtc/include-prefixes \
            -I arch/arm64/boot/dts/qcom \
            arch/arm64/boot/dts/qcom/raphael-sm8150-overlay.dts \
            -o debug-dts/raphael-preprocessed.dts

          echo "=== Beginning of preprocessed DTS ==="
          sed -n '1,120p' debug-dts/raphael-preprocessed.dts

          echo "=== tlmm locations ==="
          grep -n -B5 -A10 '&tlmm' \
            debug-dts/raphael-preprocessed.dts | head -80 || true
      - name: Debug Raphael DTBO only
        if: ${{ inputs.mode == 'quick' }}
        run: |
          export PATH="$HOME/tc/r547379/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64

          echo "========================================="
          echo "=== Force Raphael-only DTBO ==="
          echo "========================================="

          python3 <<'PY'
          from pathlib import Path

          p = Path("arch/arm64/boot/dts/qcom/Makefile")
          lines = p.read_text().splitlines()

          raphael_line = None
          start = None
          end = None

          # 找 Raphael DTBO
          for i, line in enumerate(lines):
              if "raphael-sm8150-overlay.dtbo" in line and "-base" not in line:
                  raphael_line = i
                  break

          if raphael_line is None:
              raise SystemExit(
                  "ERROR: Cannot find raphael-sm8150-overlay.dtbo"
              )

          # 向上寻找这个 dtbo-$(CONFIG_ARCH_SM8150) += 块的开始
          for i in range(raphael_line, -1, -1):
              if "dtbo-$(CONFIG_ARCH_SM8150)" in lines[i]:
                  start = i
                  break

          if start is None:
              raise SystemExit("ERROR: Cannot find DTBO block start")

          # 向下找连续的反斜杠列表结束位置
          end = start

          while end < len(lines):
              current = lines[end].rstrip()

              if end == start:
                  end += 1
                  continue

              # 当前行没有 \，说明这是列表最后一项
              if not current.endswith("\\"):
                  break

              end += 1

          # end 现在指向列表最后一项
          print("Original block:")
          for line in lines[start:end + 1]:
              print(line)

          new_block = [
              "dtbo-$(CONFIG_ARCH_SM8150) += \\",
              "\traphael-sm8150-overlay.dtbo",
          ]

          lines[start:end + 1] = new_block

          p.write_text("\n".join(lines) + "\n")

          print()
          print("New block:")
          for line in new_block:
              print(line)
          PY

          echo
          echo "========================================="
          echo "=== VERIFY MAKEFILE ==="
          echo "========================================="

          sed -n '1,35p' arch/arm64/boot/dts/qcom/Makefile

          echo
          echo "========================================="
          echo "=== Check active DTBO list ==="
          echo "========================================="

          grep -n \
            "dtbo-\$(CONFIG_ARCH_SM8150)" \
            arch/arm64/boot/dts/qcom/Makefile || true

          echo
          echo "========================================="
          echo "=== DTC version ==="
          echo "========================================="

          out/scripts/dtc/dtc --version || true

          echo
          echo "========================================="
          echo "=== Build Raphael DTBO - V=1 ==="
          echo "========================================="

          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC="ccache clang" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            DTC_EXT=/usr/bin/dtc \
            V=1 \
            dtbs \
            -j1

          echo
          echo "========================================="
          echo "=== Raphael output ==="
          echo "========================================="

          find out/arch/arm64/boot/dts/qcom \
            -type f \
            -name "*raphael*.dtbo" \
            -exec ls -lh {} \;

          test -f \
            out/arch/arm64/boot/dts/qcom/raphael-sm8150-overlay.dtbo

          echo
          echo "Raphael DTBO test PASSED."

      - name: Test Raphael with system DTC
        if: ${{ inputs.mode == 'quick' }}
        run: |
          echo "=== System DTC ==="
          /usr/bin/dtc --version

          FILE="out/arch/arm64/boot/dts/qcom/.raphael-sm8150-overlay.dtbo.dts.tmp"
          OUTPUT="/tmp/raphael-system-dtc.dtbo"

          echo "=== Compile the exact Kbuild preprocessed DTS ==="
          test -f "$FILE"
          /usr/bin/dtc \
            -O dtb \
            -o "$OUTPUT" \
            -b 0 \
            -@ \
            "$FILE"

          echo "=== System DTC result ==="
          ls -lh "$OUTPUT"

      - name: Build kernel and device trees
        if: ${{ inputs.mode == 'full' }}
        run: |
          export PATH="$HOME/tc/r547379/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64

          if [ "${{ steps.kernel-out-cache.outputs.cache-hit }}" = "true" ] && \
             [ -f out/.raphael-90hz-cache ] && \
             [ -s out/arch/arm64/boot/Image.gz-dtb ] && \
             [ -s out/arch/arm64/boot/dts/qcom/raphael-sm8150-overlay.dtbo ]; then
            echo "Reusing cached kernel and Raphael DTBO."
          else
            make O=out \
              ARCH=arm64 \
              LLVM=1 \
              LLVM_IAS=1 \
              CC="ccache clang" \
              CROSS_COMPILE=aarch64-linux-gnu- \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              DTC_EXT=/usr/bin/dtc \
              Image.gz-dtb \
              dtbs \
              -j$(nproc)

            touch out/.raphael-90hz-cache
          fi

      - name: Verify compiled Raphael true 90 Hz DTBO
        run: |
          DTBO="out/arch/arm64/boot/dts/qcom/raphael-sm8150-overlay.dtbo"
          DTS="/tmp/raphael-true90.dts"

          test -s "$DTBO"
          /usr/bin/dtc -I dtb -O dts -o "$DTS" "$DTBO"

          python3 <<'PY'
          import re
          from pathlib import Path

          text = Path("/tmp/raphael-true90.dts").read_text()

          def node_blocks(source: str, name: str) -> list[str]:
              """Extract all matching nodes from a decompiled overlay.

              A compiled DTBO may contain the same node name in more than one
              overlay fragment. The source DTS has one node, but requiring
              global uniqueness after dtc decompilation rejects a valid image
              before its contents can be checked.
              """
              matches = list(
                  re.finditer(
                      rf"^[ \t]*(?:[A-Za-z_][A-Za-z0-9_]*:[ \t]*)?"
                      rf"{re.escape(name)}[ \t]*\{{",
                      source,
                      re.MULTILINE,
                  )
              )
              blocks = []
              for match in matches:
                  start = match.start()
                  brace = source.find("{", start, match.end())
                  depth = 0
                  for pos in range(brace, len(source)):
                      if source[pos] == "{":
                          depth += 1
                      elif source[pos] == "}":
                          depth -= 1
                          if depth == 0:
                              blocks.append(source[start:pos + 1])
                              break
                  else:
                      raise RuntimeError(f"{name}: unterminated node")
              return blocks

          def cell(block: str, prop: str) -> int:
              match = re.search(
                  rf"{re.escape(prop)}\s*=\s*<([^>]+)>;", block
              )
              if not match:
                  raise RuntimeError(f"{prop}: property missing")
              return int(match.group(1).split()[0], 0)

          expected_cells = {
              "qcom,mdss-dsi-panel-framerate": 90,
              "qcom,mdss-dsi-panel-clockrate": 1_500_000_000,
              "qcom,mdss-mdp-transfer-time-us": 10_108,
              "qcom,mdss-dsi-h-front-porch": 22,
              "qcom,mdss-dsi-h-back-porch": 16,
              "qcom,mdss-dsi-h-pulse-width": 16,
              "qcom,mdss-dsi-v-back-porch": 22,
              "qcom,mdss-dsi-v-front-porch": 16,
              "qcom,mdss-dsi-v-pulse-width": 16,
          }
          expected_phy = "00 24 0a 0a 26 25 09 0a 06 03 04 00 1e 1a"
          expected_commands = (
              "a3 a9 a1 4a 00 1a b8",
              "a3 a9 a1 4a 00 8a 18",
          )
          forbidden_commands = (
              "a3 b9 a1 4a 00 1a b8",
              "a3 b9 a1 4a 00 8a 18",
          )
          panel_nodes = (
              "qcom,mdss_dsi_ss_fhd_ea8076_cmd",
              "qcom,mdss_dsi_ss_fhd_ea8076_global_cmd",
          )

          def validate_timing(panel_name: str, block: str) -> None:
              for prop, expected in expected_cells.items():
                  actual = cell(block, prop)
                  if actual != expected:
                      raise SystemExit(
                          f"{panel_name}: {prop}={actual}, expected {expected}"
                      )

              phy = re.search(
                  r"qcom,mdss-dsi-panel-phy-timings\s*=\s*\[([^]]+)\];",
                  block,
                  re.S,
              )
              if not phy or " ".join(phy.group(1).lower().split()) != expected_phy:
                  raise SystemExit(f"{panel_name}: PHY tuple mismatch")

              normalized = " ".join(block.lower().split())
              for command in expected_commands:
                  if command not in normalized:
                      raise SystemExit(
                          f"{panel_name}: command sequence missing: {command}"
                      )
              for command in forbidden_commands:
                  if command in normalized:
                      raise SystemExit(
                          f"{panel_name}: stale command sequence present: {command}"
                      )

          def validate_panel_properties(panel_name: str, panel: str) -> None:
              step_cells = {
                  "xiaomi,mdss-dsi-step-refresh-base-rate": 60,
                  "xiaomi,mdss-dsi-step-refresh-bridge-rate": 72,
                  "xiaomi,mdss-dsi-step-refresh-target-rate": 90,
              }
              for prop, expected in step_cells.items():
                  actual = cell(panel, prop)
                  if actual != expected:
                      raise SystemExit(
                          f"{panel_name}: {prop}={actual}, expected {expected}"
                      )

              if not re.search(
                  r"xiaomi,mdss-dsi-step-refresh-switch\s*;", panel
              ):
                  raise SystemExit(f"{panel_name}: step-refresh switch missing")

          all_timings = node_blocks(text, "timing@3")
          valid_global_timings = []
          timing_errors = []
          for index, timing in enumerate(all_timings, 1):
              try:
                  validate_timing("timing@3", timing)
              except (RuntimeError, SystemExit) as error:
                  timing_errors.append(f"timing {index}: {error}")
              else:
                  valid_global_timings.append(timing)

          if len(valid_global_timings) < len(panel_nodes):
              raise RuntimeError(
                  "compiled DTBO does not contain enough complete true-90 "
                  "timing nodes: "
                  + " | ".join(timing_errors)
              )

          for panel_name in panel_nodes:
              candidates = node_blocks(text, panel_name)
              if not candidates:
                  raise RuntimeError(f"{panel_name}: node not found")

              panel_text = "\n".join(candidates)
              valid = 0
              errors = []
              for index, panel in enumerate(candidates, 1):
                  try:
                      validate_panel_properties(panel_name, panel)
                      timing = node_blocks(panel, "timing@3")
                      if len(timing) != 1:
                          raise RuntimeError(
                              f"candidate {index}: expected one timing@3 "
                              f"node, found {len(timing)}"
                          )
                      validate_timing(panel_name, timing[0])
                  except (RuntimeError, SystemExit) as error:
                      errors.append(f"candidate {index}: {error}")
                  else:
                      valid += 1

              if valid == 0:
                  # dtc may split one logical overlay node across multiple
                  # fragments. Validate panel-level properties across all
                  # same-name fragments and use the complete timing node
                  # selected above.
                  validate_panel_properties(panel_name, panel_text)
                  print(
                      f"{panel_name}: merged {len(candidates)} overlay "
                      "fragments for true-90 validation"
                  )
                  continue
              print(
                  f"{panel_name}: validated {valid} of "
                  f"{len(candidates)} overlay node candidates"
              )

          print("Compiled Raphael DTBO contains the verified true-90 tuple")
          PY

      - name: Save kernel output cache
        if: ${{ inputs.mode == 'full' && steps.kernel-out-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: out
          key: raphael-out-${{ runner.os }}-r547379-${{ steps.kernel-cache-key.outputs.sha }}

      - name: Create Raphael DTBO image
        if: ${{ inputs.mode == 'full' }}
        run: |
          python3 scripts/dtc/mkdtboimg.py create \
            out/arch/arm64/boot/dtbo.img \
            --page_size=4096 \
            out/arch/arm64/boot/dts/qcom/raphael-sm8150-overlay.dtbo

          python3 scripts/dtc/mkdtboimg.py dump \
            out/arch/arm64/boot/dtbo.img

      - name: Package AnyKernel3
        if: ${{ inputs.mode == 'full' }}
        run: |
          chmod +x scripts/package-anykernel3.sh
          scripts/package-anykernel3.sh \
            out/arch/arm64/boot/Image.gz-dtb \
            out/arch/arm64/boot/dtbo.img \
            out/raphael-kamioc-72-84-90hz-ksunext-ak3.zip

      # ============================================================
      # Diagnostics
      # ============================================================
      - name: Dump failed Raphael preprocessed DTS
        if: ${{ failure() && inputs.mode == 'quick' }}
        run: |
          echo "========================================="
          echo "=== Actual DTS passed to DTC ==="
          echo "========================================="

          FILE="out/arch/arm64/boot/dts/qcom/.raphael-sm8150-overlay.dtbo.dts.tmp"

          if [ -f "$FILE" ]; then
            echo "Found: $FILE"
            echo
            nl -ba "$FILE" | head -250
          else
            echo "DTS tmp file not found."

            echo
            echo "=== Available Raphael temp files ==="

            find out/arch/arm64/boot/dts/qcom \
              -maxdepth 1 \
              -type f \
              -name "*raphael*" \
              -print || true
          fi
      - name: Show ccache statistics
        if: always()
        run: |
          echo "=== ccache statistics ==="
          ccache -s || true

      # ============================================================
      # Outputs — full mode only
      # ============================================================

      - name: Show build outputs
        if: ${{ inputs.mode == 'full' }}
        run: |
          echo "=== arch/arm64/boot ==="

          find out/arch/arm64/boot \
            -maxdepth 3 \
            -type f \
            \( \
              -name "Image*" \
              -o -name "*.dtb" \
              -o -name "*.dtbo" \
              -o -name "dtbo.img" \
            \) \
            -exec ls -lh {} \; || true

          echo
          echo "=== Expected Raphael outputs ==="

          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "Image.gz-dtb:"
            ls -lh out/arch/arm64/boot/Image.gz-dtb
          fi

          if [ -f out/arch/arm64/boot/Image ]; then
            echo "Image:"
            ls -lh out/arch/arm64/boot/Image
          fi

          if [ -f out/arch/arm64/boot/Image.gz ]; then
            echo "Image.gz:"
            ls -lh out/arch/arm64/boot/Image.gz
          fi

          if [ -f out/arch/arm64/boot/dtbo.img ]; then
            echo "dtbo.img:"
            ls -lh out/arch/arm64/boot/dtbo.img
          fi

      - name: Upload 60/72/84/90 Hz kernel
        if: ${{ inputs.mode == 'full' }}
        uses: actions/upload-artifact@v4
        with:
          name: raphael-kamioc-60-72-84-90hz-test
          if-no-files-found: warn
          path: |
            out/raphael-kamioc-72-84-90hz-ksunext-ak3.zip
            out/raphael-kamioc-72-84-90hz-ksunext-ak3.zip.sha256
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dtbo.img
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
